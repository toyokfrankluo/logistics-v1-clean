<div class="import-overview">
  <p class="steps">上传发票 <span>→</span> 核对预览 <span>→</span> 提交审核</p>
  <a class="button secondary" href="{{ url_for('tms_client.template_file') }}">下载星睿单票模板</a>
</div>
<p>使用 11.6 版星睿发票。每次上传一份 .xlsx（最多 2 MiB），多票请逐份上传。</p>
{% if replacement %}<p class="notice">替换 {{ replacement.invoice.customer_number }} 的发票后，订单将回到待确认，需要再次提交审核。</p>{% endif %}
<form method="post" action="{{ url_for('tms_client.upload') }}" enctype="multipart/form-data" class="invoice-upload">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if replacement %}
  <input type="hidden" name="replace" value="{{ replacement.id }}">
  <input type="hidden" name="revision" value="{{ replacement.revision }}">
  {% endif %}
  <label class="upload-zone">
    <span aria-hidden="true" class="upload-plus">＋</span>
    <strong>选择星睿发票</strong>
    <input type="file" name="invoice" accept=".xlsx" required>
    <small>客户单号、货箱编号和地址库编码请使用文本格式。</small>
  </label>
  <button>解析并预览</button>
</form>
