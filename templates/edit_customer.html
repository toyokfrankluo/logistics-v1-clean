{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>编辑客户</h2>
  <form method="post" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if accounts_return %}<input type="hidden" name="return_to" value="tms">{% endif %}
    <div class="col-md-6"><label class="form-label">客户名称</label><input name="name" class="form-control" value="{{ customer.name }}" required></div>
    <div class="col-md-6"><label class="form-label">银行信息</label><input name="bankinfo" class="form-control" value="{{ customer.bank_info or '' }}"></div>
    <div class="col-md-4"><label class="form-label">邮箱</label><input type="email" name="email" class="form-control" value="{{ customer.email or '' }}"></div>
    <div class="col-md-4"><label class="form-label">电话</label><input name="phone" class="form-control" value="{{ customer.phone or '' }}"></div>
    <div class="col-12"><button class="btn btn-primary">保存</button> <a class="btn btn-secondary" href="{{ url_for('tms_staff.accounts' if accounts_return else 'views.customers') }}">返回</a></div>
  </form>
</div>
{% endblock %}
